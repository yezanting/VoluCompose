[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medcompose"
version = "0.1.0"
description = "VoluCompose: training-free volumetric visual token compression"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = [
  "torch>=2.4.0",
  "transformers==4.57.3",
  "geoopt==0.5.1",
]

[project.urls]
Repository = "https://github.com/yezanting/VoluCompose"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["medcompose", "medcompose.volucompose*", "medcompose.visionzip*", "medcompose.holitom*", "medcompose.unicomp*"]
exclude = ["*.build*", "*.__pycache__*"]
namespaces = true
